<style>
/* Layout: one reading column (~66ch) with figures that break wider; a lab-report long-read. */
:root {
  --bg: #f6f7f5;
  --panel: #ffffff;
  --ink: #14202a;
  --ink-2: #4a5560;
  --ink-3: #78828b;
  --rule: #dfe3e0;
  --grid: #e9ece9;
  --off: #2a78d6;          /* previous action OFF / treatment OFF */
  --on: #eb6834;           /* previous action ON / treatment ON */
  --accent: #1d5f8c;
  --danger: #b4232d;       /* progression threshold */
  --ok: #2f7d4f;
  --band-on: rgba(235,104,52,.16);
  --g-ref: #14202a; --g-mr: #1baf7a; --g-mc: #6250d6; --g-boot: #8a94a0;
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --step--1: .8125rem; --step-0: 1rem; --step-1: 1.1875rem; --step-2: 1.5rem; --step-3: 2.125rem; --step-4: clamp(2.2rem, 5vw, 3.4rem);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171c; --panel: #182129; --ink: #e8ecee; --ink-2: #b3bdc5; --ink-3: #87929b; --rule: #2a353e; --grid: #222c34;
  --off: #4a95ee; --on: #f07c4c; --accent: #7cb7e3; --danger: #ef6b6b; --ok: #5cbf86; --band-on: rgba(240,124,76,.20);
  --g-ref: #e8ecee; --g-mr: #2cc48c; --g-mc: #9085e9; --g-boot: #7d8893; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11171c; --panel: #182129; --ink: #e8ecee; --ink-2: #b3bdc5; --ink-3: #87929b; --rule: #2a353e; --grid: #222c34;
  --off: #4a95ee; --on: #f07c4c; --accent: #7cb7e3; --danger: #ef6b6b; --ok: #5cbf86; --band-on: rgba(240,124,76,.20);
  --g-ref: #e8ecee; --g-mr: #2cc48c; --g-mc: #9085e9; --g-boot: #7d8893; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--step-0); line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
.wrap { max-width: 1040px; margin: 0 auto; }
.col { max-width: 44rem; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.2; margin: 0; font-weight: 600; }
h1 { font-size: var(--step-4); letter-spacing: -.01em; }
h2 { font-size: var(--step-3); }
h3 { font-size: var(--step-1); }
p { margin: 0; }
.prose { display: grid; gap: .9rem; }
.prose p, .prose li { color: var(--ink-2); }
.prose strong { color: var(--ink); font-weight: 600; }
code, .mono { font-family: var(--f-mono); font-size: .88em; }
p .mono, footer .mono, .prose .mono { overflow-wrap: anywhere; }
.eyebrow { font-family: var(--f-mono); font-size: var(--step--1); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.hero { padding-block: 56px 32px; display: grid; gap: 22px; border-bottom: 1px solid var(--rule); }
.hero .lede { font-family: var(--f-display); font-size: var(--step-2); line-height: 1.35; color: var(--ink); max-width: 38rem; }
.hero .lede em { font-style: normal; color: var(--on); }
.hero .lede b { font-weight: 600; color: var(--off); }
.meta-line { color: var(--ink-3); font-size: var(--step--1); font-family: var(--f-mono); }

.rule-card { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0; border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; overflow: hidden; }
.rule-card > div { padding: 16px 18px; display: grid; gap: 4px; align-content: start; border-right: 1px solid var(--rule); }
.rule-card > div:last-child { border-right: 0; }
.rule-card .k { font-size: var(--step--1); color: var(--ink-3); }
.rule-card .v { font-family: var(--f-display); font-size: var(--step-2); font-variant-numeric: tabular-nums; }
.rule-card .v small { font-family: var(--f-body); font-size: var(--step--1); color: var(--ink-3); }
@media (max-width: 520px) { .rule-card > div { border-right: 0; border-bottom: 1px solid var(--rule); } }

section { padding-block: 56px 8px; display: grid; gap: 22px; }
.section-head { display: grid; gap: 8px; }

.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule);
  padding-block: 10px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.toolbar .lbl { font-size: var(--step--1); color: var(--ink-3); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { font: inherit; font-size: var(--step--1); padding: 6px 12px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button + button { border-left: 1px solid var(--rule); }
.toolbar .hash { font-family: var(--f-mono); font-size: var(--step--1); color: var(--ink-3); }

figure { margin: 0; display: grid; gap: 10px; }
.fig { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; position: relative; }
.fig svg { display: block; width: 100%; height: auto; overflow: visible; }
figcaption { font-size: var(--step--1); color: var(--ink-3); max-width: 44rem; }
figcaption b { color: var(--ink-2); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--step--1); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.sw.line { height: 2px; width: 16px; border-radius: 0; }
.sw.dash { height: 0; width: 16px; border-top: 2px dashed; border-radius: 0; }

svg text { font-family: var(--f-body); fill: var(--ink-3); font-size: 11px; }
svg .axis-title { fill: var(--ink-2); font-size: 12px; }
svg .gridline { stroke: var(--grid); stroke-width: 1; }
svg .axisline { stroke: var(--rule); stroke-width: 1; }
svg .lab { fill: var(--ink-2); font-size: 11.5px; }
svg .lab-strong { fill: var(--ink); font-size: 12px; font-weight: 600; }
svg .halo { paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
section > *, figure > *, .wrap > * { min-width: 0; }

.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.4; padding: 6px 9px; border-radius: 4px; white-space: nowrap; font-family: var(--f-mono); z-index: 3; }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; align-items: start; }
.two > * { min-width: 0; }

.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); overflow: hidden; counter-reset: s; }
.flow > div { padding: 14px 16px; border-right: 1px solid var(--rule); display: grid; gap: 4px; align-content: start; }
.flow > div:last-child { border-right: 0; }
.flow .n { font-family: var(--f-mono); font-size: var(--step--1); color: var(--accent); }
.flow h3 { font-size: var(--step-0); font-family: var(--f-body); font-weight: 600; }
.flow p { font-size: var(--step--1); color: var(--ink-2); }
@media (max-width: 640px) { .flow > div { border-right: 0; border-bottom: 1px solid var(--rule); } }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); font-variant-numeric: tabular-nums; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { color: var(--ink-3); font-weight: 500; }
td.num, th.num { text-align: right; font-family: var(--f-mono); }
tr:last-child td { border-bottom: 0; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; font-family: var(--f-mono); }
.pill.good { color: var(--ok); } .pill.bad { color: var(--danger); }

.explorer { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: center; }
@media (max-width: 720px) { .explorer { grid-template-columns: 1fr; } }
.explorer .controls { display: grid; gap: 14px; }
.explorer label { font-size: var(--step--1); color: var(--ink-2); display: grid; gap: 6px; }
.explorer input[type=range] { width: 100%; accent-color: var(--accent); }
.verdict { font-family: var(--f-display); font-size: var(--step-2); }
.verdict.on { color: var(--on); } .verdict.off { color: var(--off); }
.path { font-family: var(--f-mono); font-size: var(--step--1); color: var(--ink-2); display: grid; gap: 2px; }

.callout { border-left: 3px solid var(--danger); padding: 4px 0 4px 16px; color: var(--ink-2); max-width: 44rem; }
.callout.neutral { border-left-color: var(--accent); }
ul.clean { margin: 0; padding-left: 1.1rem; display: grid; gap: .45rem; }
pre.code { margin: 0; overflow-x: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--rule); color: var(--ink-3); font-size: var(--step--1); }
@media (prefers-reduced-motion: no-preference) { .fig svg .anim { transition: opacity .25s ease; } }
</style>
<style>
.figs { display: grid; gap: 40px; padding-block: 8px 0; }
.fighead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.fighead .no { font-family: var(--f-mono); font-size: var(--step--1); color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
.fighead h2 { font-size: var(--step-1); }
header.mini { padding-block: 40px 22px; display: grid; gap: 8px; border-bottom: 1px solid var(--rule); margin-bottom: 28px; }
header.mini h1 { font-size: var(--step-3); }
.controls-row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.controls-row .lbl { font-size: var(--step--1); color: var(--ink-3); }
</style>
</head>

<div class="wrap">
<header class="mini">
  <div class="eyebrow">Policy distillation · agent used for experiment · policy.pth b136b65433d5</div>
  <h1>Distillation Figures</h1>
  <p class="meta-line">Depth-3 CART tree fitted to the agent's P(treatment ON). All panels show the checkpoint in Agent_used_for_experiment.</p>
</header>
<div class="figs">

<figure>
  <div class="fighead"><span class="no">Figure 1</span><h2>Pulse cycle under the agent's control</h2></div>
  <div class="fig" id="figCycle"></div>
  <div class="legend" id="legCycle"></div>
  <figcaption>Burden at each decision point from the configured starting tumour (resistant fraction 5×10⁻⁴). Shaded: treated intervals. Dashed: fitted start and continue thresholds. Red: progression at 3×.</figcaption>
</figure>

<figure>
  <div class="fighead"><span class="no">Figure 2</span><h2>Extracted decision tree</h2></div>
  <div class="fig" id="figTree" style="overflow-x:auto"></div>
  <figcaption>Leaf values are mean agent P(ON); orange leaves mean treat. The grey branch only isolates the first decision of an episode (zero-padded history).</figcaption>
</figure>

<figure>
  <div class="fighead"><span class="no">Figure 3</span><h2>Treatment probability against current burden</h2></div>
  <div class="fig" id="figPortrait"></div>
  <div class="legend" id="legPortrait"></div>
  <figcaption>1,400 sampled held-out decisions, coloured by whether the last interval was treated. Dashed: fitted two-threshold rule.</figcaption>
</figure>

<figure>
  <div class="fighead"><span class="no">Figure 4</span><h2>Fidelity of the stand-in models</h2></div>
  <div class="controls-row">
    <span class="lbl">Held-out set</span>
    <div class="seg" id="splitSeg">
      <button type="button" id="s-test" data-s="test" aria-pressed="true">Test trajectories</button>
      <button type="button" id="s-rob" data-s="robustness_test" aria-pressed="false">New initial conditions</button>
    </div>
    <span class="lbl">Metric</span>
    <div class="seg" id="metricSeg">
      <button type="button" id="m-agree" data-m="hard_action_agreement" aria-pressed="true">Agreement</button>
      <button type="button" id="m-bal" data-m="balanced_accuracy" aria-pressed="false">Balanced accuracy</button>
      <button type="button" id="m-sw" data-m="switching_F1" aria-pressed="false">Switching F1</button>
    </div>
  </div>
  <div class="fig" id="figFid"></div>
  <figcaption>Agreement with the agent's deterministic decisions. Dashed red: always-OFF baseline.</figcaption>
</figure>

<figure>
  <div class="fighead"><span class="no">Figure 5</span><h2>Gain from treatment history</h2></div>
  <div class="fig" id="figHist"></div>
  <figcaption>All-input tree minus burden-only tree, with 95% intervals from 2,000 paired trajectory bootstraps. Left: reduction in P(ON) error. Right: agreement gain in percentage points.</figcaption>
</figure>

<div class="two">
  <figure>
    <div class="fighead"><span class="no">Figure 6a</span><h2>One flipped action</h2></div>
    <div class="fig" id="figPert"></div>
    <div class="legend" id="legPert"></div>
    <figcaption>Unperturbed run versus the same run with a single flipped decision.</figcaption>
  </figure>
  <figure>
    <div class="fighead"><span class="no">Figure 6b</span><h2>Fragility to flipped actions</h2></div>
    <div class="fig" id="figEps"></div>
    <figcaption>Share of the agent's own runs that progress within 60 decisions, by fraction of actions flipped.</figcaption>
  </figure>
</div>

<figure>
  <div class="fighead"><span class="no">Figure 7</span><h2>Thresholds across the agent ensemble</h2></div>
  <div class="fig" id="figEns"></div>
  <div class="legend" id="legEns"></div>
  <figcaption>Fitted start and continue thresholds per agent. Above the diagonal: harder to continue than to start (pulsing). Bootstrap-refit agents live in their own tumour models, so their thresholds are not directly comparable.</figcaption>
</figure>

</div>
</div>

    const llabel = n.thr < 0.1 ? "yes (padded)" : condText(n, "L"), rlabel = n.thr < 0.1 ? "no" : condText(n, "R");
    draw(n.left, x0, mid, d + 1, lpad && n.thr < 0.1 ? true : padded, [cx, cy], llabel, "L");
    draw(n.right, mid, x1, d + 1, padded, [cx, cy], rlabel, "R");
  }
  draw(tree, 0, W, 0, false, null);
}

/* ---------- portrait ---------- */
function renderPortrait() {

  el("line", { x1: m.l, x2: W - m.r, y1: y(.5), y2: y(.5), stroke: css("--ink-3"), "stroke-dasharray": "2 3" }, G);

  }));
  [[r.start, "--off", `start if Bₜ ≥ ${r.start.toFixed(2)}`, "end", -6], [r.stay, "--on", `continue if Bₜ > ${r.stay.toFixed(2)}`, "start", 6]].forEach(([v, c, l, a, dx]) => {
    el("line", { x1: x(v), x2: x(v), y1: m.t, y2: H - m.b, stroke: css(c), "stroke-width": 2, "stroke-dasharray": "6 4" }, G);
    txt(G, x(v) + dx, m.t - 8, l, { "text-anchor": a, class: "lab-strong", style: `fill:${css(c)}` });
  });
  const n0 = pts.filter(p => p[2] === 0).length, n1 = pts.length - n0;
  legend("legPortrait", [["", css("--off"), `last interval untreated (${n0})`], ["", css("--on"), `last interval treated (${n1})`], ["dash", css("--ink-3"), "fitted two-threshold rule"]]);
}

/* ---------- fidelity ---------- */
function renderFid() {
  const T = D.teachers[state.t], E = T.eval[state.split], M = state.metric;
  const rows = [
    ["tree_all_features_depth3", "Tree, all 8 inputs, depth 3", "--ink"],
    ["tree_burden_only_depth3", "Tree, burden only, depth 3", "--off"],
    ["tree_action_only_depth3", "Tree, actions only, depth 3", "--g-boot"],
    ["rule_hysteresis_fitted", "Two-threshold rule (Bₜ, aₜ)", "--on"],
    ["tree_all_features_depth4", "Tree, all inputs, depth 4", "--accent"],
  ].filter(r => E[r[0]]);
  const base = E.constant_majority_action[M];
  const box = document.getElementById("figFid"), W = 960, rowH = 40, m = { l: 230, r: 70, t: 10, b: 40 }, H = m.t + m.b + rows.length * rowH;
  const svg = svgBox(box, W, H), lo = 0.4, x = lin(lo, 1, m.l, W - m.r);
  const G = el("g", {}, svg);
  [0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1].forEach(v => { el("line", { x1: x(v), x2: x(v), y1: m.t, y2: H - m.b, class: "gridline" }, G); txt(G, x(v), H - m.b + 18, v.toFixed(1), { "text-anchor": "middle" }); });
  txt(G, (m.l + W - m.r) / 2, H - 6, { hard_action_agreement: "share of decisions matching the agent", balanced_accuracy: "balanced accuracy (mean of ON and OFF recall)", switching_F1: "F1 for switching decisions" }[M], { "text-anchor": "middle", class: "axis-title" });
  const tp = tip(box);
  rows.forEach(([k, label, c], i) => {
    const v = E[k][M], yc = m.t + i * rowH + rowH / 2;
    txt(G, m.l - 12, yc + 4, label, { "text-anchor": "end", class: "lab" });
    const bar = el("rect", { x: x(lo), y: yc - 9, width: Math.max(0, x(v) - x(lo)), height: 18, rx: 3, fill: css(c), opacity: 0.9 }, G);
    txt(G, x(v) + 6, yc + 4, v.toFixed(3), { class: "lab-strong" });
    bar.addEventListener("mousemove", ev => tp.show(`${label}<br>agreement ${fmt(E[k].hard_action_agreement)}<br>balanced acc. ${fmt(E[k].balanced_accuracy)}<br>switching F1 ${fmt(E[k].switching_F1)}<br>P(ON) MAE ${fmt(E[k].probability_MAE)}`, ev));
    bar.addEventListener("mouseleave", tp.hide);
  });
  el("line", { x1: x(base), x2: x(base), y1: m.t - 4, y2: H - m.b, stroke: css("--danger"), "stroke-width": 1.5, "stroke-dasharray": "4 3" }, G);
  txt(G, x(base) + 4, H - m.b - 4, `always OFF ${base.toFixed(3)}`, { class: "lab", style: `fill:${css("--danger")}` });
}

/* ---------- history CI ---------- */
function renderHist() {
  const box = document.getElementById("figHist"), W = 960, H = 160;
  const svg = svgBox(box, W, H), G = el("g", {}, svg);
  const panels = [["MAE_burden_minus_all", "P(ON) error reduction", -0.005, 0.07, v => v.toFixed(2), 1], ["agree_all_minus_burden", "agreement gain (pp)", -0.012, 0.07, v => (100 * v).toFixed(0), 100]];
  const items = [["experimental_agent", "test"], ["experimental_agent", "robustness_test"]];
  const tp = tip(box);
  panels.forEach(([k, title, lo, hi, f], pi) => {
    const x0 = 210 + pi * 380, x1 = x0 + 330, x = lin(lo, hi, x0, x1), top = 30, rowH = 42, bottom = top + items.length * rowH;
    txt(G, x0, 16, title, { class: "lab-strong" });
    [0, 0.02, 0.04, 0.06].forEach(v => { el("line", { x1: x(v), x2: x(v), y1: top - 4, y2: bottom, class: "gridline" }, G); txt(G, x(v), bottom + 16, f(v), { "text-anchor": "middle" }); });
    el("line", { x1: x(0), x2: x(0), y1: top - 6, y2: bottom, stroke: css("--ink-2"), "stroke-width": 1.2 }, G);
    items.forEach(([t, s], i) => {
      const u = D.teachers[t].uncertainty[s][k], yc = top + i * rowH + rowH / 2, c = t === "experimental_agent" ? css("--on") : css("--off");
      if (pi === 0) txt(G, 200, yc + 4, s === "test" ? "Test trajectories" : "New initial conditions", { "text-anchor": "end", class: "lab" });
      el("line", { x1: x(u.ci95[0]), x2: x(u.ci95[1]), y1: yc, y2: yc, stroke: c, "stroke-width": 2.5 }, G);
      const dot = el("circle", { cx: x(u.estimate), cy: yc, r: 6, fill: c, stroke: css("--panel"), "stroke-width": 2 }, G);
      dot.addEventListener("mousemove", ev => tp.show(`${NAMES[t]}, ${s === "test" ? "test" : "new starts"}<br>${f(u.estimate)} [${f(u.ci95[0])}, ${f(u.ci95[1])}]`, ev));
      dot.addEventListener("mouseleave", tp.hide);
    });
  });
}

/* ---------- closed loop ---------- */
function renderPert() {
  const T = D.teachers[state.t], g = T.greedy, p = T.perturbed;
  const box = document.getElementById("figPert"), W = 480, H = 280, m = { l: 46, r: 12, t: 14, b: 44 };
  const n = Math.max(p.length + 1, 22);
  const svg = svgBox(box, W, H), x = lin(-0.5, n - 0.5, m.l, W - m.r), y = lin(0, 3.6, H - m.b, m.t), G = el("g", {}, svg);
  axes(G, x, y, { xt: [0, 5, 10, 15, 20].filter(v => v < n), yt: [0, 1, 2, 3], xl: "decision point", yl: "burden (× initial)", x0: m.l, x1: W - m.r, y0: H - m.b, y1: m.t });
  el("line", { x1: m.l, x2: W - m.r, y1: y(3), y2: y(3), stroke: css("--danger"), "stroke-width": 1.5 }, G);
  const gs = g.filter(r => r[0] < n);
  el("polyline", { points: gs.map(([s, b]) => `${x(s)},${y(b)}`).join(" "), fill: "none", stroke: css("--ink-3"), "stroke-width": 2, "stroke-dasharray": "4 3" }, G);
  el("polyline", { points: p.map(([s, b]) => `${x(s)},${y(b)}`).join(" "), fill: "none", stroke: css("--ink"), "stroke-width": 2 }, G);
  const tp = tip(box);
  p.forEach(([s, b, a, fl]) => {
    const c = el("circle", { cx: x(s), cy: y(b), r: fl ? 7 : 3.5, fill: a ? css("--on") : css("--panel"), stroke: fl ? css("--danger") : (a ? css("--on") : css("--ink")), "stroke-width": fl ? 2.5 : 1.5 }, G);
    c.addEventListener("mousemove", ev => tp.show(`decision ${s}<br>B = ${b.toFixed(2)}<br>executed ${a ? "ON" : "OFF"}${fl ? "<br>flipped" : ""}`, ev));
    c.addEventListener("mouseleave", tp.hide);
    if (fl) txt(G, x(s), y(b) - 14, "flipped", { "text-anchor": "middle", class: "lab-strong halo", style: `fill:${css("--danger")}` });
  });
  const last = p[p.length - 1];
  txt(G, x(last[0]) + 4, y(3) - 8, "progresses", { "text-anchor": "middle", class: "lab", style: `fill:${css("--danger")}` });
  legend("legPert", [["line", css("--ink"), "one flipped action"], ["dash", css("--ink-3"), "unperturbed run"], ["", css("--on"), "treated"]]);
}
function renderEps() {
  const T = D.teachers[state.t], E = T.eps_prog.primary;
  const entries = Object.entries(E).map(([k, v]) => [Number(k), v]).sort((a, b) => a[0] - b[0]);
  const keys = entries.map(e => e[0]);
  const box = document.getElementById("figEps"), W = 480, H = 280, m = { l: 46, r: 12, t: 24, b: 44 };
  const svg = svgBox(box, W, H), G = el("g", {}, svg), y = lin(0, 1, H - m.b, m.t);
  const bw = (W - m.l - m.r) / keys.length;
  [0, .25, .5, .75, 1].forEach(v => { el("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: "gridline" }, G); txt(G, m.l - 8, y(v) + 4, (100 * v) + "%", { "text-anchor": "end" }); });
  keys.forEach((k, i) => {
    const v = entries[i][1], cx = m.l + bw * i + bw / 2;
    el("rect", { x: cx - bw * 0.3, y: y(v), width: bw * 0.6, height: Math.max(0, y(0) - y(v)), rx: 3, fill: v > 0 ? css("--danger") : css("--ok"), opacity: 0.85 }, G);
    txt(G, cx, y(v) - 6, pct(v), { "text-anchor": "middle", class: "lab-strong" });
    txt(G, cx, H - m.b + 18, (100 * k) + "% flipped", { "text-anchor": "middle" });
  });
  el("line", { x1: m.l, x2: W - m.r, y1: y(0), y2: y(0), class: "axisline" }, G);
}
/* ---------- ensemble ---------- */
const GROUP = { reference_teacher: ["Agent used for experiment", "--g-ref"], methods_repeat: ["Paper LV params, new seeds", "--g-mr"], methods_control: ["Paper LV params, control", "--g-mc"], bootstrap_lv: ["Bootstrap-refit LV params", "--g-boot"] };
function renderEns() {
  const E = D.ensemble, box = document.getElementById("figEns"), W = 960, H = 420, m = { l: 60, r: 20, t: 16, b: 50 };
  const svg = svgBox(box, W, H), x = lin(0.6, 3.1, m.l, W - m.r), y = lin(0.6, 3.1, H - m.b, m.t), G = el("g", {}, svg);
  axes(G, x, y, { xt: [1, 1.5, 2, 2.5, 3], yt: [1, 1.5, 2, 2.5, 3], xl: "start threshold (after untreated interval)", yl: "continue threshold (after treated interval)", x0: m.l, x1: W - m.r, y0: H - m.b, y1: m.t, xfmt: v => v.toFixed(1), yfmt: v => v.toFixed(1) });
  el("line", { x1: x(0.6), y1: y(0.6), x2: x(3.1), y2: y(3.1), stroke: css("--ink-3"), "stroke-dasharray": "4 4" }, G);
  txt(G, x(2.85), y(2.85) + 18, "equal thresholds", { "text-anchor": "middle", class: "lab" });
  txt(G, x(0.8), y(2.95), "pulsing: harder to continue than to start", { class: "lab" });
  txt(G, x(2.95), y(0.75), "continuation bias", { "text-anchor": "end", class: "lab" });
  const tp = tip(box);
  const order = ["bootstrap_lv", "methods_control", "methods_repeat", "reference_teacher"];
  order.forEach(gname => E.filter(r => r.group === gname).forEach(r => {
    const [label, c] = GROUP[gname], big = gname !== "bootstrap_lv";
    const cx = x(r.hysteresis_start), cy = y(r.hysteresis_stay);
    const s = el(gname === "reference_teacher" ? "rect" : "circle", gname === "reference_teacher" ? { x: cx - 6, y: cy - 6, width: 12, height: 12, transform: `rotate(45 ${cx} ${cy})` } : { cx, cy, r: big ? 6 : 5 }, G);
    s.setAttribute("fill", css(c)); s.setAttribute("stroke", css("--panel")); s.setAttribute("stroke-width", 2); s.setAttribute("fill-opacity", big ? 1 : 0.8);
    s.addEventListener("mousemove", ev => tp.show(`${r.agent_code} · ${label}<br>start ${r.hysteresis_start.toFixed(2)}, continue ${r.hysteresis_stay.toFixed(2)}<br>tree agreement ${fmt(r.test_all_features_agreement)} (burden-only ${fmt(r.test_burden_only_agreement)})<br>root split ${r.root_feature}`, ev));
    s.addEventListener("mouseleave", tp.hide);
    if (gname === "reference_teacher") {
      txt(G, cx + 12, cy + 16, NAMES[r.agent_code], { class: "lab-strong halo", "text-anchor": "start" });
    }
  }));
  legend("legEns", Object.values(GROUP).map(([l, c]) => ["", css(c), l]));
}

/* ---------- wiring ---------- */
function segment(id, key, after) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(`#${id} button`).forEach(o => o.setAttribute("aria-pressed", o === b ? "true" : "false"));
    state[key] = b.dataset[Object.keys(b.dataset)[0]]; renderFid();
  }));
}
segment("splitSeg", "split"); segment("metricSeg", "metric");
function renderAll() { renderCycle(); renderTree(); renderPortrait(); renderFid(); renderHist(); renderPert(); renderEps(); renderEns(); }
renderAll();
const mq = window.matchMedia("(prefers-color-scheme: dark)");
mq.addEventListener && mq.addEventListener("change", renderAll);
new MutationObserver(renderAll).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
